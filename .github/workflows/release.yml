name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller==6.22.2

      - name: Build executables
        run: |
          pyinstaller pdf.spec
          pyinstaller overleaf.spec

      # Manual runs: build only, upload as a downloadable artifact, no release.
      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: icpc-statement-builder-exe
          path: dist/*.exe

      # Tag runs: create a release and attach both executables.
      - name: Attach executables to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
